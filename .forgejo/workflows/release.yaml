name: Sync Release to GitHub

on:
 release:
  types: [published]

jobs:
 sync-release:
  runs-on: docker

  steps:
   - name: Sync release to GitHub
     env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      TAG_NAME: ${{ forgejo.event.release.tag_name }}
      RELEASE_NAME: ${{ forgejo.event.release.name }}
      RELEASE_BODY: ${{ forgejo.event.release.body }}
      PRERELEASE: ${{ forgejo.event.release.prerelease }}
     run: |
      set -e

      API="https://api.github.com/repos/thehazell/id/releases"

      payload="$(jq -n \
        --arg tag "$TAG_NAME" \
        --arg name "$RELEASE_NAME" \
        --arg body "$RELEASE_BODY" \
        --argjson prerelease "$PRERELEASE" \
        '{
          tag_name: $tag,
          name: $name,
          body: $body,
          prerelease: $prerelease,
          draft: false
        }')"

      # Check whether the release already exists.
      response="$(curl \
        --silent \
        --show-error \
        --header "Accept: application/vnd.github+json" \
        --header "Authorization: Bearer ${GITHUB_TOKEN}" \
        --header "X-GitHub-Api-Version: 2022-11-28" \
        "${API}/tags/${TAG_NAME}")"

      if echo "$response" | jq -e '.id' >/dev/null 2>&1; then
        release_id="$(echo "$response" | jq -r '.id')"

        echo "GitHub release ${TAG_NAME} already exists; updating it."

        curl \
          --fail \
          --silent \
          --show-error \
          --request PATCH \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          --header "Content-Type: application/json" \
          --data "$payload" \
          "${API}/${release_id}" >/dev/null
      else
        echo "Creating GitHub release ${TAG_NAME}."

        curl \
          --fail \
          --silent \
          --show-error \
          --request POST \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          --header "Content-Type: application/json" \
          --data "$payload" \
          "$API" >/dev/null
      fi
